# ==============================================================================
# KB J Capital Intranet — Kubernetes Secret TEMPLATE
#
# DO NOT FILL THIS FILE IN AND DO NOT COMMIT REAL VALUES.
#
# Deploy procedure:
#   1. cp k8s/secret.example.yaml k8s/secret.yaml
#   2. Edit k8s/secret.yaml and replace every CHANGE_ME value
#   3. Never commit/push k8s/secret.yaml (keep it out of VCS)
#
# kustomization.yaml references `secret.yaml`, so `kubectl apply -k ./k8s`
# fails fast with a clear error until the file exists.
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: kbj-intranet-secret
  namespace: kbj-intranet
  labels:
    app.kubernetes.io/name: kbj-intranet-portal
    app.kubernetes.io/component: credentials
type: Opaque
stringData:
  # PostgreSQL connection string. Absent/invalid → the app refuses to use the
  # DB and (with NODE_ENV=production) still requires SESSION_SECRET.
  # Example: postgresql://kbj:password@db-host.internal:5432/kbj_intranet
  DATABASE_URL: "postgresql://CHANGE_ME_USER:CHANGE_ME_PASSWORD@CHANGE_ME_DB_HOST:5432/kbj_intranet"

  # MANDATORY in production. 32+ random characters; the server refuses to
  # start without it when NODE_ENV=production. Generate with:
  #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
  SESSION_SECRET: "CHANGE_ME_32_PLUS_RANDOM_CHARACTERS"

  # Bootstrap admin, created automatically when the users store is empty.
  # Log in once, then rotate/change this password from the Admin UI.
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: "CHANGE_ME_STRONG_ADMIN_PASSWORD"
